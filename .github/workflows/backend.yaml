name: backend pipeline
on:
  push:
    branches: [main]
    paths: 'backend/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: 
     run:
       working-directory: 'backend'
    steps:
      - name: check out the code
        uses: actions/checkout@v4
      - name: setup the python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install -r requirements.txt
      - name: test the python
        run: pytest test_app.py 
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
       working-directory: 'backend'
    steps:
      - name: check out the code
        uses: actions/checkout@v4
      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_ACCESS_KEY}}
          aws-region: ${{secrets.AWS_REGION}}
      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: build, tag and push to ecr
        env:
          REGISTRY: ${{steps.ecr-login.outputs.registry}}
          REPOSITORY: book-inventory/book-inventory-backend
          TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$TAG .
          docker push  $REGISTRY/$REPOSITORY:$TAG
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
       working-directory: 'backend'
    steps:
      - name: checkout code
         uses: actions/checkout@v4
       - name: login to aws
         uses: aws-actions/configure-aws-credentials@v2
         with:
           aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
           aws-secret-access-key: ${{secrets.AWS_ACCESS_KEY}}
           aws-region: ${{secrets.AWS_REGION}}
       - name: zip the file
         run: zip -r  deploy.zip   appspec.yml  scripts/
       - name: upload zip to s3 bucket
         run: |
             aws s3 cp deploy.zip s3://book-inventory-bucket-1/backend/deploy.zip
       - name: Trigger AWS CodeDeploy Deployment
         run: |
             aws deploy create-deployment \
             --application-name code-deploy-frontend \
             --deployment-group-name backend-dg \
             --s3-location bucket=book-inventory-bucket-1,key=backend/deploy.zip,bundleType=zip



