name: Database pipeline
on:
  push:
    branches: [ main ]
    paths: 
      - 'database/**'
  workflow_dispatch:
jobs:
  build-and-push:
        runs-on: ubuntu-latest
        defaults:
         run:
           working-directory: 'database'
        steps:
            - name: checkout the code
              uses: actions/checkout@v4
            - name: configure aws
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{secrets.AWS_ACCESS_KEY}}
                aws-region: ${{secrets.AWS_REGION}}
            - name: login to ecr
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2
            - name: build and push to ecr
              env:
                REGISTORY: ${{steps.ecr-login.outputs.registry}}
                REPOSITORY: book-inventory/book-inventory-db
                TAG: latest
              run: |
                docker build -t $REGISTORY/$REPOSITORY:$TAG .
                docker push $REGISTORY/$REPOSITORY:$TAG
  deploy: 
      needs: build-and-push    
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: 'database/**'
      steps:
        - name: Connect to Tailscale
          uses: tailscale/github-action@v2
          with:
            authkey: ${{ secrets.TS_AUTHKEY }}
            tags: tag:ci-runner
        - name: login to db server and deploy db
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.DB_VM_HOST}}
            username: ${{ secrets.DB_VM_USER}}
            password: ${{secrets.DB_VM_KEY}}
            port: ${{secrets.PORT}}
            script:  |
              set -e 
               echo "login successfull..."    
               export AWS_ACCESS_KEY_ID=${{secrets.AWS_ACCESS_KEY_ID}}
               export AWS_SECRET_ACCESS_KEY=${{secrets.AWS_ACCESS_KEY}}
               export AWS_DEFAULT_REGION=${{secrets.AWS_REGION}}
               aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${{secrets.DB_ECR_REGISTORY}}
               cat << EOF >> .env
               POSTGRES_USER=${{secrets.DB_USER}}
               export POSTGRES_PASSWORD=${{secrets.DB_PASSWORD}}
               export POSTGRES_DB=${{secrets.DB_NAME}}
               export DB_HOST=${{secrets.DB_HOST}}
               EOF
               docker stop book-db || true
               docker rm book-db || true
               docker volume create book_db_volume
               docker pull ${{secrets.DB_ECR_REGISTORY}}:latest
               docker run -d --name book-db --env-file .env -p 5432:5432 \
               -v book_db_volume:/var/lib/postgresql/data \  
               ${{secrets.DB_ECR_REGISTORY}}:latest
               unset AWS_ACCESS_KEY_ID
               unset AWS_SECRET_ACCESS_KEY 
               echo  "container deployed successfully"
            
                 
