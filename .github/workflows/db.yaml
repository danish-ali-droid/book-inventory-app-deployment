name: Database pipeline
on:
  push:
    branches: [ main ]
    paths: 
      - 'database/**'
  workflow_dispatch:
jobs:
  build-and-push:
        runs-on: ubuntu-latest
        defaults:
         run:
           working-directory: 'database'
        steps:
            - name: checkout the code
              uses: actions/checkout@v4
            - name: configure aws
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{secrets.AWS_ACCESS_KEY}}
                aws-region: ${{secrets.AWS_REGION}}
            - name: login to ecr
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2
            - name: build and push to ecr
              env:
                REGISTORY: ${{steps.ecr-login.outputs.registry}}
                REPOSITORY: book-inventory/book-inventory-db
                TAG: latest
              run: |
                docker build -t $REGISTORY/$REPOSITORY:$TAG .
                docker push $REGISTORY/$REPOSITORY:$TAG
  deploy: 
      needs: build-and-push    
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: 'database/**'
      steps:
        - name: Connect to Tailscale
          uses: tailscale/github-action@v2
          with:
            authkey: ${{ secrets.TS_AUTHKEY }}
            tags: tag:ci-runner
        - name: login to db server and deploy db
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.DB_VM_HOST}}
            username: ${{ secrets.DB_VM_USER}}
            password: ${{secrets.DB_VM_KEY}}
            port: ${{secrets.PORT}}
            script:  |
               set -e 
              echo "login successfull..."
               if ! command aws 2> /dev/null; then
               curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
               unzip awscliv2.zip
               sudo ./aws/install
               echo "aws is installing..."
               fi
               export AWS_ACCESS_KEY_ID=${{secrets.AWS_ACCESS_KEY_ID}}
               export AWS_ACCESS_KEY=${{secrets.AWS_ACCESS_KEY}}
               export AWS_REGION=${{secrets.AWS_REGION}}
               REGISTRY="${{secrets.AWS_ACCESS_KEY_ID}}.dkr.ecr.$AWS_REGION.amazonaws.com"
               aws ecr  get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com
               PARAM_PATH="/prod/secrets"
               aws ssm get-parameters-by-path \
               --path "$PARAM_PATH" \
               --with-decryption \
               --recursive \
               --query "Parameters[*].[Name,Value]" \
               --output text | while read -r name value; do
               key=$(echo "$name" | awk -F'/' '{print $NF}')
               echo "${key}=${value}" >> .env
               export "${key}=${value}"
               done
               docker stop book-db || true
               docker rm book-db || true
               docker volume create book_db_volume
               docker pull $REGISTRY/book-inventory/book-inventory-db:latest
               docker run -d \ 
               --name book-db --env-file .env -p 5432:5432 \
               -v book_db_volume:/var/lib/postgresql/data \  
               $REGISTRY/book-inventory/book-inventory-db:latest
               unset AWS_ACCESS_KEY_ID
               unset AWS_SECRET_ACCESS_KEY 
               echo  "container deployed successfully"
            
                 
